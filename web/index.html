<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relative Value Charts</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 id="pair-title">Relative Value Charts</h1>
    <span class="sub" id="pair-desc"></span>
    <span class="spacer"></span>
    <span class="sub" id="live-stamp"></span>
    <button class="ghost" id="theme-toggle" type="button">Dark</button>
  </header>

  <div class="controls">
    <div class="seg" id="pair-seg" role="group" aria-label="Pair"></div>
    <div class="seg" id="tf-seg" role="group" aria-label="Timeframe"></div>

    <label class="field">Lookback
      <input type="number" id="lookback" min="1" step="1" aria-label="Lookback days">
      <span class="sub">days</span>
    </label>

    <label class="field">Mean/σ over
      <select id="stat-window">
        <option value="full">full range</option>
        <option value="500">last 500 bars</option>
        <option value="200">last 200 bars</option>
        <option value="100">last 100 bars</option>
      </select>
    </label>

    <label class="check"><input type="checkbox" id="extended" aria-label="Include extended-hours bars"> Extended hours</label>
    <label class="check"><input type="checkbox" id="live" checked aria-label="Live quote updates"> Live</label>
    <button class="ghost" id="refresh" type="button">Refresh</button>
  </div>

  <div class="banner error" id="error" hidden></div>
  <div class="banner" id="notice" hidden></div>

  <div class="strip" id="strip"></div>

  <div class="chart-card" id="chart-card">
    <div class="readout" id="readout"></div>
    <div id="chart"></div>
    <div class="loading" id="loading" hidden>Loading…</div>
    <div class="legend" id="legend">
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--series-1)" stroke-width="2"/></svg>Ratio</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-2)" stroke-width="2"/></svg>Mean</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>±1σ</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="10 4"/></svg>±2σ</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/></svg>±3σ</span>
    </div>
  </div>

  <details class="table-view">
    <summary>Table view — levels and recent points</summary>
    <div class="tables">
      <table id="levels-table"><caption>Mean &amp; standard-deviation levels</caption></table>
      <table id="bars-table"><caption>Last 25 bars</caption></table>
    </div>
  </details>

  <footer class="note" id="foot"></footer>

</div>

<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/app.js"></script>
</body>
</html>
