<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relative Value Charts</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 id="pair-title">Relative Value Charts</h1>
    <span class="sub" id="pair-desc"></span>
    <span class="spacer"></span>
    <span class="sub" id="live-stamp"></span>
    <button class="ghost" id="theme-toggle" type="button">Dark</button>
  </header>

  <div class="controls">
    <div class="seg" id="pair-seg" role="group" aria-label="Pair"></div>
    <div class="seg" id="tf-seg" role="group" aria-label="Timeframe"></div>

    <label class="field">Lookback
      <input type="number" id="lookback" min="1" step="1" aria-label="Lookback days">
      <span class="sub">days</span>
    </label>

    <label class="field">Mean/σ over
      <select id="stat-window">
        <option value="full">full range</option>
        <option value="500">last 500 bars</option>
        <option value="200">last 200 bars</option>
        <option value="100">last 100 bars</option>
      </select>
    </label>

    <label class="check"><input type="checkbox" id="extended" aria-label="Include extended-hours bars"> Extended hours</label>
    <label class="check"><input type="checkbox" id="live" checked aria-label="Live quote updates"> Live</label>
    <button class="ghost" id="refresh" type="button">Refresh</button>
  </div>

  <form class="custom-row" id="custom-row" hidden>
    <span class="sub">Ratio of</span>
    <input type="text" id="custom-num" class="sym" placeholder="GLD" aria-label="Numerator symbol"
           autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24">
    <span class="op">÷</span>
    <input type="text" id="custom-den" class="sym" placeholder="SLV" aria-label="Denominator symbol"
           autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24">
    <button class="ghost primary" id="custom-plot" type="submit">Plot</button>
    <span class="recents" id="custom-recents"></span>
  </form>

  <div class="banner error" id="error" hidden></div>
  <div class="banner" id="notice" hidden></div>

  <div class="strip" id="strip"></div>

  <div class="chart-card" id="chart-card">
    <div class="readout" id="readout"></div>
    <div id="chart"></div>
    <div class="loading" id="loading" hidden>Loading…</div>
    <div class="legend" id="legend">
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--series-1)" stroke-width="2"/></svg>Ratio</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-2)" stroke-width="2"/></svg>Mean</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>±1σ</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="10 4"/></svg>±2σ</span>
      <span><svg class="swatch-line" width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/></svg>±3σ</span>
    </div>
  </div>

  <details class="table-view">
    <summary>Table view — levels and recent points</summary>
    <div class="tables">
      <table id="levels-table"><caption>Mean &amp; standard-deviation levels</caption></table>
      <table id="bars-table"><caption>Last 25 bars</caption></table>
    </div>
  </details>

  <section class="screener" id="screener">
    <div class="screener-head">
      <h2>Screener</h2>
      <span class="sub" id="scr-sub">Scores every SPY and QQQ member against its own benchmark.</span>
    </div>

    <div class="controls">
      <div class="seg" id="scr-tf-seg" role="group" aria-label="Screener timeframe"></div>
      <label class="field">Mean/σ over
        <select id="scr-stat">
          <option value="full">full range</option>
          <option value="500">last 500</option>
          <option value="200">last 200</option>
          <option value="100">last 100</option>
        </select>
      </label>
      <label class="field">Flag |z| ≥
        <input type="number" id="scr-threshold" value="3" step="0.25" min="0" max="10"
               aria-label="Z-score threshold">
      </label>
      <label class="check"><input type="checkbox" id="scr-sp500" checked> S&amp;P 500</label>
      <label class="check"><input type="checkbox" id="scr-ndx" checked> Nasdaq-100</label>
      <label class="check"><input type="checkbox" id="scr-prefer" checked
             title="Names in both indices are scored against QQQ; uncheck to use SPY">
        Dual members vs QQQ</label>
      <button class="ghost primary" id="scr-run" type="button">Run scan</button>
      <button class="ghost" id="scr-cancel" type="button" hidden>Cancel</button>
    </div>

    <div class="progress" id="scr-progress" hidden>
      <div class="bar"><span id="scr-bar"></span></div>
      <span class="sub" id="scr-status"></span>
    </div>

    <div class="banner error" id="scr-error" hidden></div>
    <div id="scr-results"></div>
  </section>

  <footer class="note" id="foot"></footer>

</div>

<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/app.js"></script>
</body>
</html>
